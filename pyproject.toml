[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infranode"
version = "0.1.0"
description = "Keyless Python client for the InfraNode open-data API (84 German cities) with LangChain and LlamaIndex tools."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "InfraNode", email = "admin@infranode.dev" }]
keywords = [
    "infranode",
    "open-data",
    "germany",
    "api",
    "weather",
    "air-quality",
    "langchain",
    "llamaindex",
    "ai-agent",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://infranode.dev"
Documentation = "https://infranode.dev"
Source = "https://github.com/street1983nk/infranode-python"
"API Source" = "https://github.com/street1983nk/infranode"

[tool.hatch.build.targets.wheel]
packages = ["src/infranode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
